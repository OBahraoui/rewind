# Rewind reversibility policy.
#
# Principle: let agents do anything Rewind can undo; stop them only for what it can't.
# Autonomy is set by reversibility, not by a fixed approval level.
#
# Classes
#   reversible     the exact prior state can be put back
#   compensatable  the effect is neutralised by a new, recorded action (history is kept)
#   irreversible   cannot be undone; Rewind gates it and never claims to undo it
#
# Agents may not edit this file (see gate.protected_paths).
version: 1

ignore:
  # Rewind's status labels are bookkeeping. Objects Rewind creates (restore branches and MRs,
  # incidents) are tracked by identity, never by name or label, so agents can't hide changes.
  label_prefixes: ["rewind:"]

# How Rewind recognises agent-made commits. Duo flows commit as a group service account,
# so an agent commit that reaches the default branch without a gated merge is caught.
agents:
  commit_author_emails: ['^service_account_.*@noreply\.gitlab\.com$']
  commit_author_names: ['^Duo ']

# Security findings an agent introduced must be fixed (by the agent) before merge.
security:
  fix_severities: [Critical, High]
  max_fix_attempts: 1

snapshot:
  # Issues and MRs: every open one, plus closed ones updated in this window.
  lookback_days: 30

# First matching rule wins. Unknown changes fall through to the last rule: fail closed.
classify:
  - {kind: cloud_run, op: updated, class: reversible,
     reason: "Traffic is pinned back to the checkpoint revision; Cloud Run keeps old revisions, so this takes seconds."}
  - {kind: cloud_run, class: irreversible,
     reason: "A Cloud Run service appearing or disappearing is outside Rewind's inverse set."}

  - {kind: feature_flag, class: reversible,
     reason: "Flag state and strategies are restored exactly."}

  - {kind: label, class: reversible,
     reason: "Project labels are recreated or removed exactly; memberships are restored on each issue and MR."}

  - {kind: repository, op: updated, class: compensatable,
     reason: "A restore commit returns the default branch tree to the checkpoint; the agent's commits stay in history for audit."}
  - {kind: repository, class: irreversible,
     reason: "The default branch itself was created or removed."}

  - {kind: branch, op: updated, before: {protected: true}, class: irreversible,
     reason: "Protected branches cannot be force-reset through the API."}
  - {kind: branch, class: reversible,
     reason: "Unprotected branches are deleted or recreated at their checkpoint commit."}

  - {kind: tag, op: deleted, class: reversible,
     reason: "The tag is recreated on the same commit."}
  - {kind: tag, class: compensatable,
     reason: "The tag is removed; anyone who already fetched it keeps a copy."}

  - {kind: release, op: updated, class: reversible,
     reason: "Release name and notes are restored."}
  - {kind: release, class: compensatable,
     reason: "The release is removed or recreated; notifications already sent cannot be recalled."}

  - {kind: merge_request, op: deleted, class: irreversible,
     reason: "A deleted merge request cannot be restored."}
  - {kind: merge_request, after: {state: merged}, class: compensatable,
     reason: "A merge cannot be un-merged: the code is restored by the repository restore and the MR is annotated."}
  - {kind: merge_request, op: created, class: compensatable,
     reason: "The MR is closed with a note instead of deleted, so the record stays."}
  - {kind: merge_request, op: updated, class: reversible,
     reason: "State, title, labels and draft status are restored."}

  - {kind: issue, op: deleted, class: irreversible,
     reason: "A deleted issue cannot be restored."}
  - {kind: issue, op: created, class: compensatable,
     reason: "The issue is closed with a note instead of deleted, so the record stays."}
  - {kind: issue, op: updated, class: reversible,
     reason: "State, title, labels and assignees are restored."}

  - {kind: ci_variable, op: created, class: reversible,
     reason: "The new variable is deleted."}
  - {kind: ci_variable, op: updated, fields_any: [value_fp], class: irreversible,
     reason: "Rewind stores only a keyed fingerprint of variable values, never the value, so it cannot put an old value back."}
  - {kind: ci_variable, op: updated, class: reversible,
     reason: "Variable settings (protected, masked, raw, type) are restored."}
  - {kind: ci_variable, op: deleted, class: irreversible,
     reason: "The deleted value was never stored, so it cannot be recreated."}

  - {kind: "*", class: irreversible,
     reason: "No known inverse for this kind of change; Rewind fails closed."}

# Duo Agent Platform privileges per step of the autonomous loop. Privileges that
# let an agent escape the checkpoint are never granted, whatever a step asks for.
agent_privileges:
  never:
    - start_flows   # flows started by a flow act outside this run's checkpoint
  steps:
    plan: [read_only_files, read_only_gitlab, read_write_gitlab, run_mcp_tools]
    develop: [read_write_files, read_only_gitlab, read_write_gitlab, use_git, run_commands]
    review: [read_only_files, read_only_gitlab, read_write_gitlab]
    fix: [read_write_files, read_only_gitlab, read_write_gitlab, use_git, run_commands]
    secfix: [read_write_files, read_only_gitlab, read_write_gitlab, use_git, run_commands]

# The reversibility gate runs on the MR before merge: the last point where nothing has shipped.
gate:
  # Agents may not change their own guardrails or the delivery pipeline.
  protected_paths:
    - "rewind/**"
    - "service/**"
    - "flows/**"
    - "agents/**"
    - "ci/**"
    - "infra/**"
    - ".gitlab-ci.yml"
    - ".gitlab/**"
    - "AGENTS.md"
    - "CLAUDE.md"

  rules:
    - id: migration-without-downgrade
      paths: ["app/migrations/*.py"]
      file_must_match: 'def\s+downgrade\s*\('
      verdict: block
      reason: "A schema migration without downgrade() cannot be rolled back."

    - id: external-side-effect
      paths: ["app/**/*.py"]
      added_must_not_match: '\b(requests|httpx|aiohttp|urllib\.request|smtplib|socket)\b|\bsend_(email|sms|notification)\b'
      verdict: block
      reason: "New code reaches an external system. Messages and calls that leave the system cannot be recalled."

    - id: default-path-frozen
      paths: ["app/pricing.py"]
      frozen_functions: ["legacy_total"]
      verdict: reroute
      reason: "User-visible pricing changes must ship behind a feature flag, so release stays reversible by a flag toggle."
      instruction: >-
        Do not change legacy_total(). Implement the new behaviour only in new_pricing_total(),
        which runs only when feature flag `new_pricing` is enabled. Turn it on for production by
        setting `new_pricing: {production: true}` in config/flags.yaml; the pipeline applies it after deploy.

  # Re-route attempts before a rerouted MR is blocked.
  max_reroutes: 1
