# Rewind demo pipeline: the post-code lifecycle the agents' changes go through.
#
#   verify     unit tests (app + Rewind engine), lint, coverage
#   package    container image → GitLab container registry (+ Artifact Registry on main)
#   secure     SAST, dependency scanning, secret detection, container scanning
#   staging    deploy → apply flags → smoke test
#   production deploy (one at a time)
#   configure  apply config/flags.yaml to production
#   monitor    synthetic traffic + business invariants; a failure triggers an automatic rewind
#   release    tag + GitLab release, only after production is healthy
#
# Commits made by Rewind's restore carry "[rewind]": they are verified but never redeployed,
# because Rewind already moved production back to the checkpoint revision.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [verify, package, test, secure, staging, production, configure, monitor, release]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  APP_IMAGE: "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA"
  GCLOUD_IMAGE: "gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine"

default:
  interruptible: true
  cache:
    key: pip-$CI_JOB_NAME
    paths: [.cache/pip]

include:
  # Our own CI/CD component (templates/gate.yml), at this exact commit: every merge request pipeline
  # shows Rewind's reversibility verdict as a job and a test report. The Rewind service is the
  # enforcing gate (it also honours human approvals), so here the job reports without failing.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/gate@$CI_COMMIT_SHA
    inputs:
      stage: secure
      policy: rewind/policy.yaml
      rewind_package: base
      allow_failure: true
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

.release-rules: &release-rules
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /\[rewind\]/ && $GCP_PROJECT_ID

.gcp:
  image: $GCLOUD_IMAGE
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  before_script:
    - bash ci/gcp_auth.sh
  interruptible: false

# ---------------------------------------------------------------- verify
test:app:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install -q -r app/requirements-dev.txt
    - pytest app/tests -p no:cacheprovider --junitxml=report-app.xml --cov=app --cov-report=term --cov-report=xml:coverage-app.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report-app.xml
      coverage_report: {coverage_format: cobertura, path: coverage-app.xml}

test:rewind:
  stage: verify
  image: python:3.12  # includes git, which the gate's local-checkout tests use
  variables:
    REWIND_PROPERTY_EXAMPLES: "200"
  script:
    - pip install -q -e ".[service,dev]"
    - pytest tests -p no:cacheprovider --junitxml=report-rewind.xml --cov=rewind --cov=service --cov-report=term --cov-report=xml:coverage-rewind.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report-rewind.xml
      coverage_report: {coverage_format: cobertura, path: coverage-rewind.xml}

lint:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install -q "ruff>=0.6"
    - ruff check .

# ---------------------------------------------------------------- package
build-image:
  stage: package
  image: $GCLOUD_IMAGE
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  needs: [test:app]
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[rewind\]/
      when: never
    - when: on_success
  script:
    - apk add --no-cache docker-cli >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f app/Dockerfile -t "$APP_IMAGE" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" .
    - docker push "$APP_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ -n "${GCP_PROJECT_ID:-}" ]; then
        bash ci/gcp_auth.sh
        gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
        AR_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO:-rewind}/app:${CI_COMMIT_SHA}"
        docker tag "$APP_IMAGE" "$AR_IMAGE" && docker push "$AR_IMAGE"
        echo "pushed $AR_IMAGE"
      fi

# ---------------------------------------------------------------- secure
# Analyzers upload typed security reports; keeping the same files as plain artifacts lets
# Rewind read them through the jobs API and send findings an agent introduced back to it.
sast:
  stage: secure
  artifacts:
    paths: [gl-sast-report.json]
    reports:
      sast: gl-sast-report.json
dependency_scanning:
  stage: secure
  artifacts:
    paths: [gl-dependency-scanning-report.json]
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
secret_detection:
  stage: secure
  artifacts:
    paths: [gl-secret-detection-report.json]
    reports:
      secret_detection: gl-secret-detection-report.json
container_scanning:
  stage: secure
  needs: [build-image]
  variables:
    CS_IMAGE: $APP_IMAGE
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[rewind\]/
      when: never
    - when: on_success

# ---------------------------------------------------------------- staging
deploy:staging:
  extends: .gcp
  stage: staging
  needs: [build-image, test:rewind, lint]
  rules: *release-rules
  environment:
    name: staging
    url: $DEPLOY_URL
  script:
    - bash ci/deploy_cloud_run.sh staging
  artifacts:
    reports:
      dotenv: deploy.env

configure:staging:
  stage: staging
  image: python:3.12-slim
  needs: [deploy:staging]
  rules: *release-rules
  interruptible: false
  script:
    - pip install -q pyyaml
    - python ci/apply_flags.py --environment staging

smoke:staging:
  stage: staging
  image: python:3.12-slim
  needs: [deploy:staging, configure:staging]
  rules: *release-rules
  script:
    - python ci/monitor.py --url "$DEPLOY_URL" --mode smoke --require-flags --report smoke-report.json --junit smoke-junit.xml
  artifacts:
    when: always
    paths: [smoke-report.json]
    reports:
      junit: smoke-junit.xml

# ---------------------------------------------------------------- production
deploy:production:
  extends: .gcp
  stage: production
  # Security findings gate production. Analyzer jobs depend on the detected languages, so they're optional.
  needs:
    - smoke:staging
    - {job: semgrep-sast, optional: true}
    - {job: gemnasium-python-dependency_scanning, optional: true}
    - {job: dependency-scanning, optional: true}
    - {job: secret_detection, optional: true}
    - {job: container_scanning, optional: true}
  rules: *release-rules
  resource_group: production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - bash ci/deploy_cloud_run.sh production
  artifacts:
    reports:
      dotenv: deploy.env

configure:production:
  stage: configure
  image: python:3.12-slim
  needs: [deploy:production]
  rules: *release-rules
  resource_group: production
  interruptible: false
  script:
    - pip install -q pyyaml
    - python ci/apply_flags.py --environment production

monitor:production:
  stage: monitor
  image: python:3.12-slim
  needs: [deploy:production, configure:production]
  rules: *release-rules
  interruptible: false
  variables:
    MONITOR_WINDOW_SECONDS: "180"
  script:
    - python ci/monitor.py --url "$DEPLOY_URL" --window "$MONITOR_WINDOW_SECONDS" --require-flags
  artifacts:
    when: always
    paths: [monitor-report.json]
    reports:
      junit: monitor-junit.xml

# ---------------------------------------------------------------- release
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [monitor:production]
  rules: *release-rules
  interruptible: false
  # Release is bookkeeping, not health: a tooling hiccup here must never trigger a rewind.
  allow_failure: true
  script:
    - echo "Releasing v1.0.${CI_PIPELINE_IID} ($CI_COMMIT_SHORT_SHA) after a healthy production monitor"
  release:
    tag_name: v1.0.${CI_PIPELINE_IID}
    name: v1.0.${CI_PIPELINE_IID}
    ref: $CI_COMMIT_SHA
    description: "Shipped hands-off and monitored in production. Commit $CI_COMMIT_SHORT_SHA, pipeline $CI_PIPELINE_URL."
