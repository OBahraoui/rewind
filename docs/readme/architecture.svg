<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" role="img" font-family="IBM Plex Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" aria-label="Rewind checkpoints the project before Duo agent flows act, gates the merge request by reversibility, merges the exact gated commit and watches the release. When production monitoring fails it undoes the change set in mitigation order: traffic first, then the flag, code, merge request and issue, then verifies zero drift against the checkpoint.">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#615f69"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5040d6"/></marker>
  </defs>
  <rect width="1240" height="660" rx="18" fill="#fff"/>
  <!-- swimlanes -->
  <rect x="20" y="20" width="1200" height="176" rx="12" fill="#f6f5f1"/>
  <rect x="20" y="212" width="1200" height="236" rx="12" fill="#f0eefc"/>
  <rect x="20" y="464" width="1200" height="176" rx="12" fill="#f6f5f1"/>
  <g font-size="12" font-weight="700" letter-spacing=".12em" text-anchor="middle">
    <text transform="translate(52 108) rotate(-90)" fill="#615f69">GITLAB</text>
    <text transform="translate(52 330) rotate(-90)" fill="#3a2cb0">REWIND</text>
    <text transform="translate(52 552) rotate(-90)" fill="#615f69">GOOGLE CLOUD</text>
  </g>
  <!-- GitLab -->
  <g fill="#fff" stroke="#e3e1da">
    <rect x="130" y="58" width="200" height="82" rx="10"/><rect x="380" y="58" width="190" height="82" rx="10"/>
    <rect x="620" y="58" width="200" height="82" rx="10"/><rect x="870" y="58" width="320" height="82" rx="10"/>
  </g>
  <g font-size="15" font-weight="600" fill="#16151a" text-anchor="middle">
    <text x="230" y="92">Issue</text><text x="475" y="92">Duo agent flows</text>
    <text x="720" y="92">Merge request</text><text x="1030" y="92">CI/CD pipeline</text>
  </g>
  <g font-size="12.5" fill="#615f69" text-anchor="middle">
    <text x="230" y="114">labelled rewind:auto</text><text x="475" y="114">plan · develop · review · fix</text>
    <text x="720" y="114">gated before merge</text><text x="1030" y="114">tests · scans · deploy · flag · monitor</text>
  </g>
  <!-- what happens (grey) -->
  <g stroke="#615f69" stroke-width="1.6" fill="none" marker-end="url(#g)">
    <path d="M230 140 V318"/><path d="M475 326 V146"/><path d="M570 99 H614"/><path d="M680 140 V321"/>
    <path d="M800 326 V146"/><path d="M820 99 H864"/><path d="M1030 140 V318"/><path d="M1150 140 V520"/>
    <path d="M230 410 V520"/>
  </g>
  <g font-size="12.5" fill="#47464e">
    <text x="238" y="182">webhook</text><text x="483" y="182">starts</text><text x="574" y="88">pushes</text>
    <text x="688" y="182">head SHA</text><text x="808" y="182">merges</text><text x="1038" y="182">result</text>
    <text x="1158" y="182">deploys</text><text x="238" y="474">snapshot</text>
  </g>
  <!-- Rewind's track -->
  <line x1="230" y1="340" x2="1030" y2="340" stroke="#cfccc2" stroke-width="3"/>
  <circle cx="230" cy="340" r="16" fill="#5040d6"/><path d="M223 340l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#5040d6" stroke-width="3"><circle cx="475" cy="340" r="11"/><circle cx="680" cy="340" r="11"/><circle cx="800" cy="340" r="11"/></g>
  <circle cx="1030" cy="340" r="16" fill="#d03b3b"/><path d="M1024 334l12 12M1036 334l-12 12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <g font-size="14" font-weight="600" fill="#16151a" text-anchor="middle">
    <text x="230" y="380">Checkpoint</text><text x="475" y="380">Start flows</text><text x="680" y="380">Gate</text>
    <text x="800" y="380">Merge</text><text x="1030" y="380">Watch the release</text>
  </g>
  <g font-size="12.5" fill="#615f69" text-anchor="middle">
    <text x="230" y="398">every kind of state</text><text x="475" y="398">least privilege</text>
    <text x="680" y="398">all undoable?</text><text x="800" y="398">exact gated SHA</text>
    <text x="1030" y="398">monitor:production fails</text>
  </g>
  <!-- the rewind: the one coloured path, drawn over the rest -->
  <path d="M1030 322 C1030 248, 340 246, 246 326" fill="none" stroke="#f0eefc" stroke-width="11"/>
  <path d="M1030 322 C1030 248, 340 246, 248 323" fill="none" stroke="#5040d6" stroke-width="3.5" stroke-linecap="round" marker-end="url(#p)"/>
  <rect x="262" y="266" width="196" height="30" rx="15" fill="#5040d6"/>
  <text x="360" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">2 · flag, code, MR, issue</text>
  <text x="212" y="304" text-anchor="end" font-size="12.5" font-weight="600" fill="#3a2cb0">3 · verify:</text>
  <text x="212" y="320" text-anchor="end" font-size="12.5" font-weight="600" fill="#3a2cb0">zero drift</text>
  <path d="M1030 412 C1030 470, 930 470, 930 512" fill="none" stroke="#5040d6" stroke-width="3" stroke-linecap="round" marker-end="url(#p)"/>
  <text x="1000" y="436" text-anchor="end" font-size="12.5" font-weight="600" fill="#3a2cb0">1 · traffic back, in seconds</text>
  <!-- Google Cloud -->
  <g fill="#fff" stroke="#e3e1da"><rect x="130" y="526" width="240" height="82" rx="10"/><rect x="790" y="526" width="400" height="82" rx="10"/></g>
  <g font-size="15" font-weight="600" fill="#16151a" text-anchor="middle">
    <text x="250" y="560">Cloud Storage</text><text x="990" y="560">Cloud Run · the demo app</text>
  </g>
  <g font-size="12.5" fill="#615f69" text-anchor="middle">
    <text x="250" y="582">snapshots · runs · ledgers</text><text x="990" y="582">staging and production revisions</text>
  </g>
</svg>
