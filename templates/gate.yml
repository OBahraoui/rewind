# Rewind reversibility gate, as a GitLab CI/CD component.
#
#   include:
#     - component: gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43319182/showcase/gate@main
#       inputs:
#         stage: test
#
# On merge request pipelines it checks the change against a reversibility policy and fails
# the job when something can't be undone: code that calls external systems, migrations
# without downgrade(), edits to protected guardrail paths, or changes to frozen default
# code paths that should ship behind a feature flag. It reads the local checkout only, so
# it needs no token. Findings appear in the merge request's test report widget.
spec:
  inputs:
    stage:
      default: test
      description: Stage the gate job runs in.
    policy:
      default: ""
      description: Path to a reversibility policy in your repository. Empty uses Rewind's built-in policy.
    fail_on:
      default: block
      options: [block, reroute]
      description: The verdict that fails the job (reroute also fails on "undoable if done differently").
    allow_failure:
      type: boolean
      default: false
      description: Report only, never fail the pipeline.
    rewind_package:
      default: "https://gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43319182/showcase/-/archive/main/showcase-main.tar.gz"
      description: >-
        Where to install Rewind from (pip requirement or URL). "base" installs it from the merge
        request's base commit, for repositories that contain Rewind itself.
---
rewind-gate:
  stage: $[[ inputs.stage ]]
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: $[[ inputs.allow_failure ]]
  script:
    - git fetch -q origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" 2>/dev/null || true
    # Never let the change under review supply the gate's code or rules: both come from the base commit.
    - |
      if [ "$[[ inputs.rewind_package ]]" = "base" ]; then
        git worktree add -q /tmp/rewind-base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" && pip install -q /tmp/rewind-base
      else
        pip install -q "$[[ inputs.rewind_package ]]"
      fi
    - >-
      rewind gate --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA"
      --policy "$[[ inputs.policy ]]" --policy-ref "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      --fail-on "$[[ inputs.fail_on ]]" --report rewind-gate.json --junit rewind-gate.xml
  artifacts:
    when: always
    paths: [rewind-gate.json]
    reports:
      junit: rewind-gate.xml
