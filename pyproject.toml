[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "Ctrl+Z for autonomous software delivery on GitLab."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "mcp>=1.2,<3",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[project.scripts]
rewind = "rewind.cli.main:app"

[tool.setuptools.packages.find]
include = ["rewind*", "service*"]

[tool.setuptools.package-data]
rewind = ["policy.yaml"]
service = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/tests"]
markers = [
  "integration: talks to the real GitLab project and Cloud Run (needs .env); run with -m integration",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/tests/**" = ["S", "B"]
"scripts/**" = ["S"]
"ci/**" = ["S310"]

[tool.coverage.run]
source = ["rewind", "service", "app"]
